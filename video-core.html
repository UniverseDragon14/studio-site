<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Universal Dragon Studio | Video Core V1</title>
<style>
:root{
  --bg:#050607;
  --panel:#0d1117;
  --line:#263241;
  --text:#f5f5f5;
  --muted:#9ca3af;
  --fire:#ff5a1f;
  --gold:#ffcc4d;
  --cyan:#00d9ff;
  --green:#39ff4a;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:
    radial-gradient(circle at top left, rgba(255,90,31,.22), transparent 35%),
    radial-gradient(circle at bottom right, rgba(0,217,255,.16), transparent 35%),
    var(--bg);
  color:var(--text);
}
header{
  padding:18px;
  border-bottom:1px solid var(--line);
  background:rgba(5,6,7,.88);
  position:sticky;
  top:0;
  backdrop-filter:blur(10px);
}
.logo{font-weight:900;color:var(--gold);letter-spacing:.08em}
.wrap{padding:16px;max-width:980px;margin:auto}
.card{
  border:1px solid var(--line);
  border-radius:24px;
  padding:18px;
  background:rgba(13,17,23,.92);
  box-shadow:0 0 35px rgba(255,90,31,.12);
  margin-bottom:16px;
}
h1{font-size:clamp(32px,7vw,68px);line-height:.95;margin:8px 0}
h1 span{color:var(--fire)}
p{color:var(--muted);line-height:1.6}
label{display:block;margin-top:14px;font-weight:800;color:var(--gold)}
input,button,textarea{
  width:100%;
  margin-top:8px;
  padding:14px;
  border-radius:16px;
  border:1px solid var(--line);
  background:#090d12;
  color:var(--text);
  font-size:16px;
}
button{
  cursor:pointer;
  font-weight:900;
  background:linear-gradient(135deg,var(--fire),#b72cff);
  border:0;
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#020409;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  color:var(--green);
  min-height:90px;
}
video{
  width:100%;
  border-radius:18px;
  border:1px solid var(--line);
  background:#000;
  margin-top:12px;
}
a{color:var(--cyan)}
.small{font-size:13px;color:var(--muted)}
@media(max-width:720px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">UNIVERSAL DRAGON STUDIO · VIDEO CORE V1</div>
</header>

<div class="wrap">
  <section class="card">
    <h1>Long Video <span>Upload + Trim</span></h1>
    <p>
      V1 real backend test: upload video, choose start time, choose duration, then export MP4 using FFmpeg.
      Groq brain is for planning/title/caption later.
    </p>
    <p class="small">Private local Studio tool. Do not upload secret/private files.</p>
  </section>

  <section class="card">
    <label>1. Upload video</label>
    <input id="videoFile" type="file" accept="video/*" />
    <button onclick="uploadVideo()">Upload Video</button>

    <label>Uploaded file</label>
    <input id="uploadedFile" placeholder="Uploaded file name appears here" readonly />
  </section>

  <section class="card">
    <label>2. Trim settings</label>
    <div class="row">
      <div>
        <label>Start time</label>
        <input id="startTime" value="00:00:02" placeholder="00:00:02" />
      </div>
      <div>
        <label>Duration</label>
        <input id="duration" value="00:00:05" placeholder="00:00:05" />
      </div>
    </div>
    <button onclick="trimVideo()">Trim / Export MP4</button>
    <button onclick="extractAudio()">Extract Audio MP3</button>
  </section>

  <section class="card">
    <label>3. AI Creator Package</label>
    <textarea id="videoGoal" placeholder="Example: Make this video into YouTube shorts with title, description, tags, thumbnail prompt, and editing plan.">Make this video into YouTube shorts with title, description, tags, thumbnail prompt, and editing plan.</textarea>
    <button onclick="aiPlan()" onclick="generateCreatorPackage()">Generate AI Creator Package</button>
  </section>

  <section class="card">
    <label>Result</label>
    <pre id="result">Ready...</pre>
    <div id="videoBox"></div>
  </section>
</div>

<script>
const result = document.getElementById("result");
const uploadedFile = document.getElementById("uploadedFile");
const videoBox = document.getElementById("videoBox");

function show(obj){
  result.textContent = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
}

async function uploadVideo(){
  const f = document.getElementById("videoFile").files[0];
  if(!f){ show("Choose a video first."); return; }

  show("Uploading...");
  const form = new FormData();
  form.append("video", f);

  const res = await fetch("/api/video/upload", {
    method:"POST",
    body:form
  });

  const data = await res.json();
  show(data);

  if(data.file){
    uploadedFile.value = data.file;
  }
}

async function trimVideo(){
  const file = uploadedFile.value.trim();
  if(!file){ show("Upload video first."); return; }

  const start = document.getElementById("startTime").value.trim() || "00:00:00";
  const duration = document.getElementById("duration").value.trim() || "00:00:10";

  show("Trimming with FFmpeg...");
  videoBox.innerHTML = "";

  const res = await fetch("/api/video/trim", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ file, start, duration })
  });

  const data = await res.json();
  show(data);

  if(data.url){
    videoBox.innerHTML = `
      <p><a href="${data.url}" target="_blank">Open exported MP4</a></p>
      <video controls src="${data.url}"></video>
    `;
  }
}

async function extractAudio(){
  const file = uploadedFile.value.trim();
  if(!file){ show("Upload video first."); return; }

  show("Extracting audio MP3 with FFmpeg...");

  const res = await fetch("/api/video/extract-audio", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ file })
  });

  const data = await res.json();
  show(data);

  if(data.url){
    videoBox.innerHTML += `
      <p><a href="${data.url}" target="_blank">Open extracted MP3</a></p>
      <audio controls src="${data.url}" style="width:100%;margin-top:12px"></audio>
    `;
  }
}

async function aiPlan(){
  const file = uploadedFile.value.trim();
  if(!file){ show("Upload video first."); return; }

  const goal = document.getElementById("videoGoal").value.trim();

  show("Groq AI is creating creator package...");

  const res = await fetch("/api/video/ai-plan", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ file, goal })
  });

  const data = await res.json();

  if(data.output){
    result.textContent = data.output;
  } else {
    show(data);
  }
}

async function generateCreatorPackage(){
  const file = uploadedFile.value.trim();
  const requestBox = document.querySelector("#creatorRequest") || document.querySelector("textarea");
  const request = requestBox ? requestBox.value.trim() : "Make this video into YouTube shorts with title, description, tags, thumbnail prompt, and editing plan.";
  const start = document.getElementById("startTime").value.trim() || "00:00:00";
  const duration = document.getElementById("duration").value.trim() || "00:00:30";

  show("Generating AI Creator Package with Groq...");

  const res = await fetch("/api/video/creator-package", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ file, request, start, duration })
  });

  const data = await res.json();
  if(data.output){
    result.textContent = data.output;
  } else {
    show(data);
  }
}
</script>
</body>
</html>
